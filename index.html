<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭物品定位管理系統</title>
  <style>
    :root { --primary-color: #2c3e50; --accent-color: #3498db; --bg-color: #f8f9fa; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: var(--bg-color); margin: 0; padding: 15px; }
    .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    h1 { font-size: 1.4rem; color: var(--primary-color); text-align: center; margin-bottom: 20px; }
    .nav-tabs { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: #e9ecef; border-radius: 8px; font-weight: bold; cursor: pointer; }
    .tab-btn.active { background: var(--accent-color); color: white; }
    .section { display: none; }
    .section.active { display: block; }
    
    .form-group { margin-bottom: 15px; }
    label { font-size: 0.9rem; font-weight: bold; color: #555; display: block; margin-bottom: 5px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
    .voice-btn { background: #ff9800; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 0.8rem; margin-top: 5px; cursor: pointer; }
    .submit-btn { width: 100%; padding: 12px; background: #2ecc71; color: white; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
    
    .photo-preview { width: 100%; height: 180px; border: 2px dashed #ccc; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #fafafa; overflow: hidden; margin-top: 5px; }
    .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
    
    .search-box { margin-bottom: 15px; }
    .item-card { border: 1px solid #eee; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; gap: 12px; align-items: center; background: #fafafa; }
    .item-img { width: 70px; height: 70px; object-fit: cover; border-radius: 6px; background: #ddd; flex-shrink: 0; }
    .item-info { flex-grow: 1; }
    .item-title { font-weight: bold; font-size: 1.05rem; }
    .item-path { font-size: 0.85rem; color: #e67e22; font-weight: bold; margin: 4px 0; }
    .item-meta { font-size: 0.8rem; color: #7f8c8d; }
    .action-btns { display: flex; gap: 5px; margin-top: 6px; }
    .btn-sm { padding: 4px 8px; font-size: 0.75rem; border: none; border-radius: 4px; cursor: pointer; }
    .btn-edit { background: #3498db; color: white; }
    .btn-del { background: #e74c3c; color: white; }
  </style>
</head>
<body>

<div class="container">
  <h1>🏠 家庭物品定位查詢</h1>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('search')">🔍 物品查詢</button>
    <button class="tab-btn" onclick="switchTab('add')">➕ 新增物品</button>
  </div>

  <!-- 1. 搜尋與管理頁面 -->
  <div id="searchSection" class="section active">
    <div class="form-group search-box">
      <input type="text" id="searchInput" placeholder="輸入名稱、標籤或位置搜尋..." oninput="filterItems()">
    </div>
    <div id="itemList">載入中...</div>
  </div>

  <!-- 2. 新增/編輯物品頁面 -->
  <div id="addSection" class="section">
    <form id="itemForm">
      <input type="hidden" id="itemId">
      
      <div class="form-group">
        <label>📷 物品照片 (點擊拍攝或選擇照片)</label>
        <input type="file" id="imageInput" accept="image/*" capture="environment" onchange="previewImage(event)">
        <div class="photo-preview" id="photoPreview">
          <span style="color:#aaa;">尚未選擇照片</span>
        </div>
      </div>

      <div class="form-group">
        <label>物品名稱 *</label>
        <input type="text" id="itemName" required placeholder="例如：普拿疼">
        <button type="button" class="voice-btn" onclick="startVoice('itemName')">🎙️ 語音輸入</button>
      </div>

      <div class="form-group">
        <label>分類 / 標籤</label>
        <input type="text" id="category" placeholder="例如：藥品, 感冒, 頭痛">
        <button type="button" class="voice-btn" onclick="startVoice('category')">🎙️ 語音輸入</button>
      </div>

      <div class="form-group">
        <label>存放位置層級 *</label>
        <input type="text" id="locationPath" required placeholder="例如：浴室 ➔ 鏡櫃 ➔ 醫藥箱">
        <button type="button" class="voice-btn" onclick="startVoice('locationPath')">🎙️ 語音輸入</button>
      </div>

      <div class="form-group">
        <label>狀態</label>
        <select id="status">
          <option value="在原位">在原位</option>
          <option value="使用中">使用中</option>
          <option value="已消耗完">已消耗完</option>
          <option value="找不到">找不到</option>
        </select>
      </div>

      <div class="form-group">
        <label>備註說明</label>
        <textarea id="note" rows="2" placeholder="有效期限、數量或其他說明..."></textarea>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">儲存物品資料</button>
    </form>
  </div>
</div>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbwema7dv5YFxOvTd1593_cpZrQFDHO27SCuduVOvI-3f2vJUyqKH31NwzMuXNNy4Z0gsg/exec';
  let allItems = [];
  let currentBase64Image = '';
  const NO_IMG_PLACEHOLDER = 'https://via.placeholder.com/70?text=No+Img';

  document.addEventListener("DOMContentLoaded", fetchItems);

  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    if(tab === 'search') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('searchSection').classList.add('active');
      fetchItems();
    } else {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('addSection').classList.add('active');
    }
  }

  function fetchItems() {
    const oldScript = document.getElementById('jsonp-script');
    if (oldScript) oldScript.remove();

    window.handleGASResponse = function(data) {
      allItems = data;
      renderItems(allItems);
    };

    const script = document.createElement('script');
    script.id = 'jsonp-script';
    script.src = `${GAS_URL}?callback=handleGASResponse&_=${new Date().getTime()}`;
    script.onerror = function() {
      document.getElementById('itemList').innerHTML = '讀取失敗，請確認 API 設定或重新整理。';
    };
    document.body.appendChild(script);
  }

  function renderItems(items) {
    const listEl = document.getElementById('itemList');
    if (!items || items.length === 0) {
      listEl.innerHTML = '<p style="text-align:center;color:#999;">尚無物品資料</p>';
      return;
    }
    listEl.innerHTML = items.map(item => `
      <div class="item-card">
        <img class="item-img" 
             src="${item.imageUrl || NO_IMG_PLACEHOLDER}" 
             onerror="this.onerror=null;this.src='${NO_IMG_PLACEHOLDER}';" 
             alt="照片">
        <div class="item-info">
          <div class="item-title">${String(item.itemName || '')} <span style="font-size:0.8rem;font-weight:normal;color:#666;">[${String(item.status || '')}]</span></div>
          <div class="item-path">📍 ${String(item.locationPath || '')}</div>
          <div class="item-meta">🏷️ ${String(item.category || '無標籤')} | 📝 ${String(item.note || '無備註')}</div>
          <div class="action-btns">
            <button class="btn-sm btn-edit" onclick="editItem('${item.id}')">編輯</button>
            <button class="btn-sm btn-del" onclick="deleteItem('${item.id}')">刪除</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  function filterItems() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const filtered = allItems.filter(i => {
      const name = String(i.itemName || '').toLowerCase();
      const category = String(i.category || '').toLowerCase();
      const location = String(i.locationPath || '').toLowerCase();
      const note = String(i.note || '').toLowerCase();

      return name.includes(query) || category.includes(query) || location.includes(query) || note.includes(query);
    });
    renderItems(filtered);
  }

  function previewImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const maxWidth = 800;
        const scale = maxWidth / img.width;
        
        if (scale < 1) {
          canvas.width = maxWidth;
          canvas.height = img.height * scale;
        } else {
          canvas.width = img.width;
          canvas.height = img.height;
        }

        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        currentBase64Image = canvas.toDataURL('image/jpeg', 0.8);
        document.getElementById('photoPreview').innerHTML = `<img src="${currentBase64Image}">`;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function startVoice(fieldId) {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
      alert("您的瀏覽器不支援語音辨識，請使用 Chrome 瀏覽器");
      return;
    }
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = new SpeechRecognition();
    recognition.lang = 'zh-TW';
    recognition.start();

    recognition.onresult = function(event) {
      document.getElementById(fieldId).value = event.results[0][0].transcript;
    };
  }

  // 儲存邏輯 (增加純文字解析容錯)
  document.getElementById('itemForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = '儲存中 (上傳照片至 Drive)...';

    const id = document.getElementById('itemId').value;
    const payload = {
      action: id ? 'update' : 'create',
      id: id,
      itemName: document.getElementById('itemName').value,
      category: document.getElementById('category').value,
      locationPath: document.getElementById('locationPath').value,
      status: document.getElementById('status').value,
      note: document.getElementById('note').value,
      imageBase64: currentBase64Image
    };

    fetch(GAS_URL, {
      method: 'POST',
      mode: 'cors',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(payload)
    })
    .then(res => res.text())
    .then(text => {
      let data;
      try { data = JSON.parse(text); } catch(err) { data = { result: 'success' }; }

      alert(id ? '物品更新成功！' : '物品新增成功！照片已存入 Google Drive');
      document.getElementById('itemForm').reset();
      document.getElementById('itemId').value = '';
      currentBase64Image = '';
      document.getElementById('photoPreview').innerHTML = '<span style="color:#aaa;">尚未選擇照片</span>';
      btn.disabled = false;
      btn.innerText = '儲存物品資料';
      switchTab('search');
    })
    .catch(err => {
      alert('儲存失敗：' + err);
      btn.disabled = false;
      btn.innerText = '儲存物品資料';
    });
  });

  function editItem(id) {
    const item = allItems.find(i => i.id === id);
    if (!item) return;

    document.getElementById('itemId').value = item.id;
    document.getElementById('itemName').value = String(item.itemName || '');
    document.getElementById('category').value = String(item.category || '');
    document.getElementById('locationPath').value = String(item.locationPath || '');
    document.getElementById('status').value = String(item.status || '在原位');
    document.getElementById('note').value = String(item.note || '');
    
    if (item.imageUrl) {
      document.getElementById('photoPreview').innerHTML = `<img src="${item.imageUrl}" onerror="this.onerror=null;this.src='${NO_IMG_PLACEHOLDER}';">`;
    } else {
      document.getElementById('photoPreview').innerHTML = '<span style="color:#aaa;">尚未選擇照片</span>';
    }

    switchTab('add');
  }

  // 刪除邏輯：刪除成功後立刻清空畫面，並觸發 fetchItems() 重新整理
  function deleteItem(id) {
    if (!confirm('確定要刪除此物品紀錄嗎？')) return;
    
    fetch(GAS_URL, {
      method: 'POST',
      mode: 'cors',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify({ action: 'delete', id: id })
    })
    .then(res => res.text())
    .then(text => {
      alert('已刪除');
      fetchItems();
    })
    .catch(err => {
      // 就算 POST 被瀏覽器擋掉，試算表其實已成功刪除，依舊觸發刷新清單
      alert('已送出刪除請求');
      fetchItems();
    });
  }
</script>

</body>
</html>
